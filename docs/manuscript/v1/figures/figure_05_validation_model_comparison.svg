<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="108mm" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
<title id="title">Validation model comparison</title>
<desc id="desc">Two horizontal dot plots compare mean validation PR-AUC and ROC-AUC for five registered P1/K=6 score sources.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} .dash{stroke-dasharray:12 9}</style>
