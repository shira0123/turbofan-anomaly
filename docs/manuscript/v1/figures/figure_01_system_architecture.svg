<text x="840.0" y="533" font-size="23" font-weight="400" text-anchor="middle" fill="#222222">1,280 alert candidates under five proxies and a predeclared</text>
<text x="840.0" y="561" font-size="23" font-weight="400" text-anchor="middle" fill="#222222">lexicographic objective</text>
